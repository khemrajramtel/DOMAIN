<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Area 69 — Page not found." />
    <title>404 — Area 69</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="icon" href="icon.ico" sizes="any" />
    <style>
      :root {
        color-scheme: dark;
        font-family: "Space Grotesk", "Segoe UI", sans-serif;
        --bg-primary: #04050a;
        --bg-secondary: #0d0f1c;
        --text-primary: #f3f4ff;
        --text-muted: #a4a7c7;
        --accent: #7b61ff;
        --accent-strong: #5af0ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(
            circle at top,
            rgba(91, 64, 255, 0.35),
            transparent 45%
          ),
          radial-gradient(
            circle at 20% 20%,
            rgba(90, 240, 255, 0.25),
            transparent 40%
          ),
          var(--bg-primary);
        color: var(--text-primary);
        font-size: 16px;
        line-height: 1.6;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background: linear-gradient(
          145deg,
          rgba(123, 97, 255, 0.12),
          rgba(90, 240, 255, 0.08)
        );
        pointer-events: none;
        opacity: 0.65;
      }

      /* ── Backdrop ── */
      .backdrop {
        position: fixed;
        inset: 0;
        overflow: hidden;
        z-index: 0;
      }

      .gradient-orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(70px);
        opacity: 0.45;
        animation: drift 18s ease-in-out infinite;
      }

      .orb-one {
        width: 420px;
        height: 420px;
        top: -140px;
        left: -160px;
        background: radial-gradient(
          circle,
          rgba(123, 97, 255, 0.7),
          transparent 70%
        );
      }

      .orb-two {
        width: 360px;
        height: 360px;
        bottom: -160px;
        right: -120px;
        background: radial-gradient(
          circle,
          rgba(90, 240, 255, 0.65),
          transparent 70%
        );
        animation-delay: 4s;
      }

      .particle-field {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      .particle {
        position: absolute;
        width: var(--size, 6px);
        height: var(--size, 6px);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.28);
        filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.4));
        top: var(--top, 0%);
        left: var(--left, 0%);
        animation: particleFloat var(--duration, 12s) linear infinite;
        animation-delay: var(--delay, 0s);
      }

      /* ── Main content ── */
      .page-shell {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 2rem 1.5rem;
        gap: 1.5rem;
        opacity: 0;
        animation: fadeUp 1.1s ease 0.15s forwards;
      }

      /* ── Badge ── */
      .badge {
        align-self: center;
        margin: 0 auto;
        padding: 0.65rem 2.4rem;
        border-radius: 999px;
        position: relative;
        display: inline-flex;
        justify-content: center;
        letter-spacing: 0.38em;
        font-size: 0.82rem;
        text-transform: uppercase;
        overflow: hidden;
        isolation: isolate;
        color: #eef8ff;
        background: rgba(4, 5, 18, 0.88);
        border: 1px solid rgba(255, 255, 255, 0.25);
        box-shadow:
          inset 0 0 22px rgba(123, 97, 255, 0.35),
          inset 0 0 6px rgba(90, 240, 255, 0.35),
          0 25px 45px rgba(6, 9, 30, 0.5);
        animation: badgeFloat 5.5s ease-in-out infinite;
      }

      .badge::before {
        content: "";
        position: absolute;
        inset: -40%;
        border-radius: inherit;
        background: conic-gradient(
            from 0deg,
            rgba(123, 97, 255, 0.4),
            rgba(90, 240, 255, 0.85),
            rgba(255, 214, 165, 0.85),
            rgba(123, 97, 255, 0.4)
          )
          border-box;
        animation: badgeSpin 7s linear infinite;
        filter: blur(4px);
        opacity: 0.9;
        mask: radial-gradient(
          farthest-side,
          transparent calc(50% - 3px),
          #000 calc(50% - 1px),
          #000 100%
        );
        -webkit-mask: radial-gradient(
          farthest-side,
          transparent calc(50% - 3px),
          #000 calc(50% - 1px),
          #000 100%
        );
        z-index: 0;
      }

      .badge::after {
        content: "";
        position: absolute;
        inset: 2px;
        border-radius: inherit;
        background: rgba(5, 6, 18, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow:
          inset 0 0 25px rgba(123, 97, 255, 0.45),
          inset 0 0 8px rgba(90, 240, 255, 0.45),
          0 0 25px rgba(90, 240, 255, 0.35);
        z-index: 1;
        pointer-events: none;
      }

      .badge-shimmer {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        overflow: hidden;
        z-index: 3;
        pointer-events: none;
      }

      .badge-shimmer::after {
        content: "";
        position: absolute;
        top: 0;
        left: -60%;
        width: 45%;
        height: 100%;
        background: linear-gradient(
          120deg,
          transparent,
          rgba(255, 255, 255, 0.75),
          transparent
        );
        transform: skewX(-15deg);
        animation: badgeSweep 3.6s ease-in-out infinite;
      }

      .badge span {
        position: relative;
        z-index: 2;
        background-image: linear-gradient(
          120deg,
          #5af0ff,
          #7b61ff,
          #f8d7ff,
          #5af0ff
        );
        background-size: 240% 240%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: badgeTextGlow 2.8s linear infinite;
      }

      /* ── 404 number ── */
      .error-code {
        font-size: clamp(6rem, 20vw, 12rem);
        font-weight: 700;
        line-height: 1;
        margin: 0;
        background: linear-gradient(
          135deg,
          #7b61ff 0%,
          #5af0ff 50%,
          #f8d7ff 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 40px rgba(123, 97, 255, 0.5));
        animation: glitch 8s ease-in-out infinite;
        letter-spacing: -0.04em;
      }

      .error-title {
        font-size: clamp(1.4rem, 4vw, 2rem);
        font-weight: 600;
        margin: 0;
        color: var(--text-primary);
      }

      .error-body {
        margin: 0;
        color: var(--text-muted);
        font-size: 1.05rem;
        max-width: 420px;
      }

      /* ── CTA button ── */
      .cta-button {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.65rem;
        padding: 1rem 2rem;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 600;
        letter-spacing: 0.02em;
        font-family: inherit;
        font-size: 1rem;
        cursor: pointer;
        border: none;
        background: linear-gradient(
          120deg,
          var(--accent),
          var(--accent-strong)
        );
        color: #05060a;
        box-shadow: 0 15px 40px rgba(90, 240, 255, 0.35);
        transition:
          transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1),
          box-shadow 0.35s ease;
        overflow: hidden;
      }

      .cta-button::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: radial-gradient(
          circle at var(--px, 50%) var(--py, 50%),
          rgba(255, 255, 255, 0.35),
          transparent 55%
        );
        opacity: 0;
        transition: opacity 0.35s ease;
      }

      .cta-button:hover,
      .cta-button:focus-visible {
        transform: translateY(-2px) scale(1.04);
        box-shadow: 0 20px 50px rgba(90, 240, 255, 0.5);
        outline: none;
      }

      .cta-button:hover::after,
      .cta-button:focus-visible::after {
        opacity: 1;
      }

      .cta-button i {
        font-size: 1.1rem;
        line-height: 1;
      }

      /* ── Scanline decoration ── */
      .scanline {
        position: fixed;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 3px,
          rgba(255, 255, 255, 0.012) 3px,
          rgba(255, 255, 255, 0.012) 4px
        );
        pointer-events: none;
        z-index: 5;
      }

      /* ── Keyframes ── */
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(28px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes drift {
        0% {
          transform: translate3d(0, 0, 0) scale(1);
        }
        50% {
          transform: translate3d(40px, -30px, 0) scale(1.1);
        }
        100% {
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      @keyframes particleFloat {
        0% {
          transform: translate3d(0, 0, 0) scale(0.6);
          opacity: 0;
        }
        12% {
          opacity: 0.9;
        }
        80% {
          opacity: 0.8;
        }
        100% {
          transform: translate3d(var(--dx, 20px), var(--dy, -80px), 0)
            scale(1.2);
          opacity: 0;
        }
      }

      @keyframes badgeSpin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes badgeTextGlow {
        0% {
          background-position: 0% 50%;
          filter: drop-shadow(0 0 6px rgba(90, 240, 255, 0.5));
        }
        50% {
          background-position: 100% 50%;
          filter: drop-shadow(0 0 12px rgba(123, 97, 255, 0.7));
        }
        100% {
          background-position: 0% 50%;
          filter: drop-shadow(0 0 6px rgba(90, 240, 255, 0.5));
        }
      }

      @keyframes badgeFloat {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-3px);
        }
      }

      @keyframes badgeSweep {
        0% {
          left: -60%;
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        50% {
          left: 130%;
          opacity: 0;
        }
        100% {
          left: 130%;
          opacity: 0;
        }
      }

      @keyframes glitch {
        0%,
        90%,
        100% {
          filter: drop-shadow(0 0 40px rgba(123, 97, 255, 0.5));
          transform: none;
        }
        92% {
          filter: drop-shadow(0 0 40px rgba(90, 240, 255, 0.8))
            drop-shadow(-3px 0 rgba(255, 90, 120, 0.6));
          transform: translateX(-2px) skewX(-1deg);
        }
        94% {
          filter: drop-shadow(0 0 40px rgba(123, 97, 255, 0.5));
          transform: translateX(2px);
        }
        96% {
          filter: drop-shadow(0 0 40px rgba(90, 240, 255, 0.8));
          transform: translateX(-1px) skewX(1deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .gradient-orb,
        .particle,
        .badge,
        .badge::before,
        .badge-shimmer::after,
        .error-code,
        .page-shell,
        .cta-button {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
        .page-shell {
          opacity: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="backdrop" aria-hidden="true">
      <div class="gradient-orb orb-one"></div>
      <div class="gradient-orb orb-two"></div>
      <div class="particle-field"></div>
    </div>

    <div class="scanline" aria-hidden="true"></div>

    <main class="page-shell">
      <div class="badge" role="img" aria-label="Area 69">
        <div class="badge-shimmer" aria-hidden="true"></div>
        <span>Area 69</span>
      </div>

      <p class="error-code" aria-label="Error 404">404</p>

      <h1 class="error-title">Page Not Found</h1>
      <p class="error-body">
        Looks like this link is broken, or the page may have been moved or
        deleted.
      </p>

      <a class="cta-button" href="/" id="go-home">
        <i class="bi bi-arrow-left-circle" aria-hidden="true"></i>
        <span>Back to Area 69</span>
      </a>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const particleField = document.querySelector(".particle-field");
        const prefersReducedMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;

        if (particleField && !prefersReducedMotion) {
          const total = window.innerWidth > 1024 ? 28 : 16;
          for (let i = 0; i < total; i++) {
            const p = document.createElement("span");
            p.className = "particle";
            p.style.setProperty(
              "--size",
              `${(Math.random() * 6 + 3).toFixed(2)}px`,
            );
            p.style.setProperty("--top", `${Math.random() * 100}%`);
            p.style.setProperty("--left", `${Math.random() * 100}%`);
            p.style.setProperty(
              "--duration",
              `${(Math.random() * 10 + 10).toFixed(2)}s`,
            );
            p.style.setProperty(
              "--delay",
              `${(Math.random() * 5).toFixed(2)}s`,
            );
            p.style.setProperty(
              "--dx",
              `${(Math.random() * 80 - 40).toFixed(1)}px`,
            );
            p.style.setProperty(
              "--dy",
              `${(Math.random() * -120).toFixed(1)}px`,
            );
            particleField.appendChild(p);
          }
        }

        // Mouse-tracking glare on button
        const btn = document.getElementById("go-home");
        if (btn) {
          btn.addEventListener("mousemove", (e) => {
            const r = btn.getBoundingClientRect();
            btn.style.setProperty(
              "--px",
              `${((e.clientX - r.left) / r.width) * 100}%`,
            );
            btn.style.setProperty(
              "--py",
              `${((e.clientY - r.top) / r.height) * 100}%`,
            );
          });
          btn.addEventListener("mouseleave", () => {
            btn.style.removeProperty("--px");
            btn.style.removeProperty("--py");
          });
        }
      });
    </script>
  </body>
</html>
